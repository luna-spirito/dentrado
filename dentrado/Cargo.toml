[package]
name = "dentrado"
version = "0.1.0"
authors = ["Luna Spirito <guardspirit@protonmail.com>"]
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Functional-reactive DBMS engine"

[dependencies]
log = "0.4"
blake3 = "1"
crc32fast = "1"
compio = { version = "0.19.2", features = ["fs", "time", "runtime"] }
flume = "0.11"
futures = "0.3"
synchrony = { version = "0.1.7", features = ["watch", "event"] }
libc = "0.2"
rkyv = { version = "0.8", features = ["bytecheck"] }
imbl = "7.0"
slotmap = "1.1"
serde = "1"
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
base64 = "0.22"
similar = { version = "3", default-features = false, features = ["std"] }
dentrado-macros = { path = "../dentrado-macros" }
dentrado-types = { path = "../dentrado-types" }
dentrado-cache = { path = "../dentrado-cache" }

[dev-dependencies]
tempfile = "3"
proptest = "1"
serde = { version = "1", features = ["derive"] }
