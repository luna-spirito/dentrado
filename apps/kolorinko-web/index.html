<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kolorinko</title>
    <!--
      Wikidot's own AGPL base theme (see wikidot-base-theme/NOTICE.md) — the
      structural CSS for the page skeleton (#container, #header, #top-bar,
      #side-bar, #main-content, tables, images, …). Site-specific themes layer
      on top of it, exactly as on Wikidot. `copy-dir` ships it into dist at
      build time; the stylesheet link loads it before any per-site theme.
    -->
    <link
      data-trunk
      rel="copy-dir"
      href="wikidot-base-theme"
      data-target-path="wikidot-base-theme"
    />
    <link rel="stylesheet" href="/wikidot-base-theme/css/style.css" />
    <style>
      /* kolorinko-only bits not covered by the Wikidot base theme. */
      .kolorinko-status {
        color: #888;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <!-- Trunk builds the `kolorinko-web` bin to wasm and mounts it into #container. -->
    <link
      data-trunk
      rel="rust"
      data-bin="kolorinko-web"
      data-type-name="kolorinko_web"
      data-wasm-opt="z"
    />
  </body>
</html>
