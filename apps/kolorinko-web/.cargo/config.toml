# web-sys gates its WebTransport bindings behind this cfg (the crate features
# alone don't unlock them), so it must be set for every build of this crate —
# including the host-target check rust-analyzer runs for the linked project.
# Scoping it to `target.wasm32-unknown-unknown` would hide the bindings from
# that check (E0432: no `WebTransport` in the root). The workspace root
# `.cargo/config.toml` mirrors the target-scoped flag for root-invoked wasm
# builds; cargo discovers config from the *cwd*, not the manifest.
[build]
rustflags = ["--cfg=web_sys_unstable_apis"]
