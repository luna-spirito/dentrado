[package]
name = "kolorinko-web"
version = "0.1.0"
authors = ["Luna Spirito <guardspirit@protonmail.com>"]
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Leptos CSR frontend for the kolorinko server"

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
kolorinko-rt = { path = "../kolorinko-rt" }
kolorinko-wikitext = { path = "../kolorinko-wikitext" }
kolorinko-render = { path = "../kolorinko-render", default-features = false, features = ["csr"] }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Location",
  "Window",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "MouseEvent",
  "History",
  # WebTransport client (gated on `web_sys_unstable_apis`, enabled via
  # .cargo/config.toml).
  "WebTransport",
  "WebTransportOptions",
  "WebTransportHash",
  "WebTransportBidirectionalStream",
  "WebTransportReceiveStream",
  "WebTransportSendStream",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "WritableStream",
  "WritableStreamDefaultWriter",
] }

# Standalone crate, built to wasm32-unknown-unknown via Trunk.
# It is intentionally NOT a member of the dentrado workspace, whose other
# crates target the host.
[workspace]
