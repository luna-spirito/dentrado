[package]
name = "kolorinko-rt"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Shared gear schema + wire protocol for the kolorinko server and web client"

[dependencies]
dentrado = { path = "../../dentrado", optional = true }
dentrado-macros = { path = "../../dentrado-macros" }
kolorinko-wikitext = { path = "../kolorinko-wikitext" }
serde = { version = "1", features = ["derive"] }

[features]
# Enables the dentrado `Localizable` derive on shared id types, so they can
# appear in the server's runtime `GearId`. Off by default: the web client (and
# the wire schema) stay dentrado-free / wasm-safe.
default = []
runtime = ["dep:dentrado"]
