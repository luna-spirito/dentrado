[package]
name = "kolorinko-rt"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Shared gear schema + wire protocol for the kolorinko server and web client"

[dependencies]
dentrado-types = { path = "../../dentrado-types" }
dentrado-macros = { path = "../../dentrado-macros" }
kolorinko-wikitext = { path = "../kolorinko-wikitext" }
serde = { version = "1", features = ["derive"] }
bytes = { version = "1", features = ["serde"] }
