[package]
name = "kolorinko-render"
version = "0.1.0"
authors = ["Luna Spirito <guardspirit@protonmail.com>"]
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Shared Leptos view renderer for kolorinko (CSR web client + SSR debug CLI)"

[dependencies]
kolorinko-rt = { path = "../kolorinko-rt" }
kolorinko-wikitext = { path = "../kolorinko-wikitext" }
leptos = { version = "0.8" }

[features]
default = ["ssr"]
csr = ["leptos/csr"]
ssr = ["leptos/ssr"]
