# Dev config — what `just dev` / `just run` run against. Paths are relative to
# the workspace root (cargo's CWD). For a real deploy, copy config.example.toml
# and edit it.

# Wikidot-export sites to register as content spaces, in serving order: the
# first entry's landing page is what the bare `/` serves. The canonical space
# id is derived from the KEY, not from any operator's choice — a read-only
# export, so identity binding would only add false attribution and orphan the
# id if the key were ever lost. Whoever mirrors the same export derives the
# same id (fork navigation = URL segment swap):
#   SHA-256("wikidot-evakuilo/v1/<site>")[0..16] → 'S' + base64url.
# (Owned spaces, when they appear, will derive from an ed25519 pubkey+label
# instead — see `SpaceId`'s docs in kolorinko-rt.)
# Per site:
# - `landing` (default `start`): the page its bare `/SPACE` resolves to.
#   obscurative names it `main`, not Wikidot's default.
# - `domains`: the source site's custom domains. URLs on these hosts (e.g.
#   `www.obscurative.ru/local--files/…` in CSS `url()`) resolve to the site's
#   mirrored attachments like `<site>.wikidot.com` ones do, and `Host:`
#   requests on them address the space without a `SPACE_ID` URL segment —
#   the wiki's own domain.
[ensure-evakuilo-sites]
"obscurative" = { landing = "main", domains = ["www.obscurative.ru"] }
"rpcauthority" = { domains = ["rpc-wiki.net", "www.rpc-wiki.net", "rpc.localhost" ] }
"ru-backrooms" = {}
"srddf" = {}
"wci" = {}
"backroomsarchiveunit" = {}
"cea" = {}
"scientific-alliance" = {}

[evakuilo]
# The evakuilo daemon's instance directory — kolorinko serves the
# `out/<site>/` publications it writes (relative to the workspace root,
# cargo's CWD).
dir = "../../wikidot-evakuilo/data/kolorinko"
# Seconds between publication rescans. Cheap when idle: per site, three
# `stat`s (pages.json / files.json / shell mtimes+sizes); only drifted
# sites — and inside them only drifted pages — are re-read.
interval = 60

[server]
bind = "127.0.0.1:4433"
web_dist = "apps/kolorinko-web/dist"
inject_wt_hash = false
# Browser-trusted mkcert pair (shared by the TCP bootstrap and the H3/WT
# endpoint in pooling mode). Generate once:
#   mkdir -p .certs && cd .certs && mkcert localhost 127.0.0.1 ::1 \
#     && mv localhost+2.pem localhost.pem && mv localhost+2-key.pem localhost-key.pem
cert_file = ".certs/localhost.pem"
key_file = ".certs/localhost-key.pem"
