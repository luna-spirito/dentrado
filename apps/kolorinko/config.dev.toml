# Dev config — what `just dev` / `just run` run against. Paths are relative to
# the workspace root (cargo's CWD). For a real deploy, copy config.example.toml
# and edit it.

# Wikidot-export sites to register as content spaces. Each entry is
# `"<site>"` (landing page defaults to `start`) or `"<site>:<landing>"`; the
# canonical space id is derived from the SOURCE, not from any operator's key
# — a read-only export, so identity binding would only add false attribution
# and orphan the id if the key were ever lost. Whoever mirrors the same
# export derives the same id (fork navigation = URL segment swap):
#   SHA-256("wikidot-evakuilo/v1/<site>")[0..16] → 'S' + base64url.
# (Owned spaces, when they appear, will derive from an ed25519 pubkey+label
# instead — see `SpaceId`'s docs in kolorinko-rt.)
# obscurative's landing page is `main`, not Wikidot's default `start`.
ensure-evakuilo-sites = ["obscurative:main", "rpcauthority"]

[repo]
url = "https://github.com/luna-spirito/wikidot-kolorinko-export.git"
# Auto-created on first page load if missing.
dir = ".kolorinko/repo"
# Seconds between forced `git pull`s of the backup repository.
interval = 900

[server]
bind = "127.0.0.1:4433"
web_dist = "apps/kolorinko-web/dist"
inject_wt_hash = false
# Browser-trusted mkcert pair (shared by the TCP bootstrap and the H3/WT
# endpoint in pooling mode). Generate once:
#   mkdir -p .certs && cd .certs && mkcert localhost 127.0.0.1 ::1 \
#     && mv localhost+2.pem localhost.pem && mv localhost+2-key.pem localhost-key.pem
cert_file = ".certs/localhost.pem"
key_file = ".certs/localhost-key.pem"
