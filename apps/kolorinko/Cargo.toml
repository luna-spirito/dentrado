[package]
name = "kolorinko"
version = "0.1.0"
authors = ["Luna Spirito <guardspirit@protonmail.com>"]
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.102"
bytes = "1"
chumsky = "0.13.0"
compio = { version = "0.19.1", features = [
  "runtime",
  "io-uring",
  "fs",
  "net",
  "h3",
  "time",
  "rustls",
  "ring",
  "macros",
] }
# HTTP/3 over QUIC for compio. `compio/h3` (above) pulls compio-quic with its
# `h3` feature; the direct dep gives us `compio_quic::{ServerBuilder, Connection, ...}`.
compio-quic = "0.8"
# `socket2` builds the QUIC UDP socket with SO_REUSEPORT (compio-quic's own
# `bind` doesn't set it), so every core can listen on the same port.
socket2 = "0.6"
dentrado = { path = "../../dentrado" }
dentrado-types = { path = "../../dentrado-types" }
env_logger = "0.11.10"
flume = "0.11"
futures = "0.3.31"
h3 = "0.0.8"
h3-webtransport = "0.1"
http = "1"
imbl = "7.0"
indexmap = { version = "2", features = ["serde"] }
kolorinko-rt = { path = "../kolorinko-rt" }
kolorinko-render = { path = "../kolorinko-render", default-features = false, features = [
  "ssr",
] }
kolorinko-wikitext = { path = "../kolorinko-wikitext" }
# `ring` (also pulled by compio/quic) gives the SHA-256 for the WebTransport
# cert hash; `time` sets the short validity browsers require.
ring = "0.17"
time = "0.3"
serde_json = "1"
git2 = { version = "0.21.0", features = ["https"] }
log = "0.4.32"
rcgen = "0.14"
rustls-pki-types = "1.15"
serde = "1.0.228"
toml = "0.8"
clap = { version = "4.6.6", features = ["derive"] }
clap_derive = { version = "4.6.4" }
zstd = "0.13"

[dev-dependencies]
leptos = { version = "0.8", features = ["ssr"] }

[[bin]]
name = "kolorinko"
path = "src/main.rs"
